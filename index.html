<style>
/* Layout: one phone-width column, sticky header, fixed bottom tab bar like a POS screen. */
:root{
  --bg:#f6f7f2; --surface:#ffffff; --sunk:#eceee5; --fg:#1d221c; --muted:#5e665b; --line:#d9ddd0;
  --basil:#1f6b45; --basil-ink:#ffffff; --basil-soft:#dcebe1;
  --tomato:#c63d25; --tomato-soft:#f8e0da; --crust:#b9781f; --crust-soft:#f6ead4;
  --ok:#1f7a3f; --close:#a86a00; --miss:#bf3420;
  --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --on-tomato:#ffffff; --r:14px; --nav-h:64px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#121512; --surface:#1b201b; --sunk:#232923; --fg:#ecefe8; --muted:#a3ab9f; --line:#323a31;
  --basil:#5cc48a; --basil-ink:#0d1a12; --basil-soft:#1d3427;
  --tomato:#ff7a5f; --tomato-soft:#3a1f19; --crust:#e3a64a; --crust-soft:#372a17;
  --ok:#6fd393; --close:#f0b54a; --miss:#ff8066; --on-tomato:#2a0d07; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#121512; --surface:#1b201b; --sunk:#232923; --fg:#ecefe8; --muted:#a3ab9f; --line:#323a31;
  --basil:#5cc48a; --basil-ink:#0d1a12; --basil-soft:#1d3427;
  --tomato:#ff7a5f; --tomato-soft:#3a1f19; --crust:#e3a64a; --crust-soft:#372a17;
  --ok:#6fd393; --close:#f0b54a; --miss:#ff8066; --on-tomato:#2a0d07; color-scheme:dark }

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(var(--nav-h) + 24px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--crust);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);
  display:flex;align-items:center;gap:12px;padding-block:14px 10px;border-bottom:1px solid var(--line);margin-bottom:16px}
.brand{flex:1;min-width:0}
.brand h1{font-family:var(--display);font-weight:800;font-size:1.35rem;margin:0;letter-spacing:-.01em;line-height:1.1}
.brand p{margin:0;color:var(--muted);font-size:.82rem}
.ticket{font-family:var(--display);font-weight:700;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;
  border:1.5px dashed var(--line);padding:5px 8px;border-radius:8px;color:var(--muted);white-space:nowrap;background:none}
.iconbtn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.iconbtn svg{width:22px;height:22px}

h2{font-family:var(--display);font-weight:800;font-size:1.6rem;letter-spacing:-.015em;margin:4px 0 4px;text-wrap:balance}
.lede{color:var(--muted);margin:0 0 14px}
.eyebrow{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}

.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin:0 0 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:700;font-size:.9rem}
.chip[aria-pressed="true"]{background:var(--basil);color:var(--basil-ink);border-color:var(--basil)}

.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 10px 12px 14px}
.item .txt{flex:1;min-width:0;background:none;border:0;padding:0;text-align:left}
.es{font-family:var(--display);font-weight:700;font-size:1.18rem;line-height:1.2;display:block}
.en{color:var(--muted);display:block;font-size:.95rem}
.alt{display:block;font-size:.82rem;color:var(--crust);margin-top:2px}
.known-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-left:6px;vertical-align:middle}
.acts{display:flex;gap:6px;flex:none}
.round{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--sunk);display:grid;place-items:center}
.round svg{width:20px;height:20px}
.round.mic{background:var(--basil-soft);border-color:transparent;color:var(--basil)}

.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:700;background:var(--basil);color:var(--basil-ink);display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px}
.btn.ghost{background:var(--sunk);color:var(--fg)}
.btn.wide{width:100%}
.btn svg{width:20px;height:20px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row > .btn{flex:1 1 140px}

/* Practice panel */
.sheet-bg{position:fixed;inset:0;background:rgb(0 0 0 / .45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:600px;border-radius:20px 20px 0 0;max-height:92%;overflow:auto;
  padding:18px max(18px,env(safe-area-inset-left,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-right,0px))}
.sheet .grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px}
.sheet .es{font-size:1.6rem}
.sheet-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}

.mic-area{margin-top:16px;display:flex;flex-direction:column;gap:12px}
.bigmic{width:100%;min-height:64px;border-radius:16px;border:0;background:var(--tomato);color:var(--on-tomato);font-weight:700;font-size:1.05rem;display:flex;align-items:center;justify-content:center;gap:10px}
.bigmic svg{width:24px;height:24px}
.bigmic.on{background:var(--fg);color:var(--bg);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px var(--tomato-soft)}}
@media (prefers-reduced-motion:reduce){.bigmic.on{animation:none}}
.linkbtn{background:none;border:0;color:var(--basil);font-weight:700;padding:8px 0;align-self:center;text-decoration:underline;text-underline-offset:3px}
.live{min-height:1.4em;color:var(--muted);font-style:italic}
.fb{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.meter{height:10px;border-radius:5px;background:var(--sunk);overflow:hidden}
.meter i{display:block;height:100%;background:var(--ok);border-radius:5px}
.verdict{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.verdict b{font-family:var(--display);font-size:1.3rem}
.verdict span{font-variant-numeric:tabular-nums;font-weight:700;font-size:1.2rem}
.words{font-family:var(--display);font-size:1.2rem;font-weight:700;line-height:1.5}
.w-ok{color:var(--ok)} .w-close{color:var(--close);text-decoration:underline wavy;text-underline-offset:4px}
.w-miss{color:var(--miss);text-decoration:line-through}
.heard{font-size:.9rem;color:var(--muted)}
.tips{margin:0;padding-left:18px;font-size:.93rem;display:flex;flex-direction:column;gap:4px}
.note{background:var(--crust-soft);border-radius:12px;padding:12px 14px;font-size:.92rem}

/* Talk */
.scen{display:flex;flex-direction:column;gap:10px}
.scen button{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;gap:12px;align-items:center}
.scen .n{font-family:var(--display);font-weight:800;color:var(--crust);font-size:1.4rem;width:28px;flex:none;font-variant-numeric:tabular-nums}
.scen b{display:block;font-family:var(--display);font-size:1.08rem}
.scen small{color:var(--muted)}
.chat{display:flex;flex-direction:column;gap:10px;margin:14px 0}
.bub{max-width:88%;padding:10px 14px;border-radius:16px;border:1px solid var(--line)}
.bub.c{align-self:flex-start;background:var(--surface);border-bottom-left-radius:4px}
.bub.y{align-self:flex-end;background:var(--basil-soft);border-color:transparent;border-bottom-right-radius:4px}
.bub .who{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.bub .es{font-size:1.05rem}
.bub .en{font-size:.88rem}
.bub button.replay{background:none;border:0;padding:0;color:var(--basil);font-weight:700;font-size:.85rem;margin-top:4px}
.turn{background:var(--surface);border:2px solid var(--basil);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.hidden-es{filter:blur(7px);user-select:none;cursor:pointer}
.toggle{display:flex;align-items:center;gap:8px;font-size:.92rem;color:var(--muted)}
.toggle input{width:20px;height:20px;accent-color:var(--basil)}

/* Quiz */
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px}
.qtop{display:flex;justify-content:space-between;align-items:center;font-variant-numeric:tabular-nums;color:var(--muted);font-weight:700;font-size:.9rem}
.prog{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--crust)}
.prompt{font-family:var(--display);font-weight:800;font-size:1.7rem;line-height:1.15;text-wrap:balance}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:13px 14px;font-weight:700;min-height:50px}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--surface))}
.opt.wrong{border-color:var(--miss);background:color-mix(in srgb,var(--miss) 12%,var(--surface))}
.big-score{font-family:var(--display);font-weight:800;font-size:3.4rem;line-height:1;font-variant-numeric:tabular-nums}
.setup{display:flex;flex-direction:column;gap:14px}
label.field{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:.92rem}
select,input[type=range]{width:100%}
select{padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}

/* Bottom nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:10px;color:var(--muted);text-decoration:none;font-size:.78rem;font-weight:700}
nav.tabs a svg{width:24px;height:24px}
nav.tabs a[aria-current="page"]{color:var(--basil);background:var(--basil-soft)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:30;font-weight:700;max-width:calc(100% - 32px);text-align:center}
.muted{color:var(--muted)}
.mt{margin-top:18px}
</style>

const Voice = {
 voices:[], tts:null, cur:null, helped:false,
 init(){
  if(this.hasSS()){const f=()=>{try{this.voices=speechSynthesis.getVoices()||[]}catch(e){}};f();
   try{speechSynthesis.addEventListener("voiceschanged",f)}catch(e){speechSynthesis.onvoiceschanged=f}
   setTimeout(f,500);setTimeout(f,2000)}
  if(window.claude?.use) claude.use("tts").then(t=>{this.tts=t}).catch(()=>{});
 },
 hasSS(){return "speechSynthesis" in window && typeof SpeechSynthesisUtterance!=="undefined"},
 pick(){
  if(this.hasSS() && !this.voices.length){try{this.voices=speechSynthesis.getVoices()||[]}catch(e){}}
  const nl=v=>(v.lang||"").replace("_","-").toLowerCase();
  const es=this.voices.filter(v=>nl(v).startsWith("es"));
  if(!es.length) return null;
  const L=S.lang.toLowerCase(), lat=["es-mx","es-us","es-419"];
  return es.find(v=>nl(v)===L) || (L!=="es-es" && es.find(v=>lat.includes(nl(v)))) || es.find(v=>nl(v)!=="es-es") || es[0];
 },
 ttsSay(text,rate){
  return this.tts.speak(text,{language:S.lang==="es-419"?"es-MX":S.lang, rate:Math.max(0.7,Math.min(1.5,rate))})
   .catch(e=>{ const c=e&&e.code; if(c==="stopped"||c==="replaced")return; if(c==="busy")return toast("Finish speaking first, then tap play.");
     if(c==="not_granted"){this.tts=null;} this.fail() });
 },
 say(text,slow){
  const rate = slow ? 0.65 : S.rate;
  const v = this.pick();
  if(Mic.listening()) Mic.cancel();
  // Device voice first when it has a Spanish voice; otherwise the Claude voice; otherwise try the device anyway.
  if(this.hasSS() && (v || !this.tts)){
   const ss=speechSynthesis;
   try{ if(ss.speaking||ss.pending) ss.cancel(); ss.resume(); }catch(e){}
   const u=new SpeechSynthesisUtterance(text); this.cur=u; // keep a reference so the browser doesn't drop it
   if(v){u.voice=v;u.lang=v.lang}else u.lang=S.lang;
   u.rate=rate; u.volume=1;
   let started=false; u.onstart=()=>{started=true};
   u.onerror=e=>{ if(e.error!=="interrupted"&&e.error!=="canceled"&&!started){ this.tts?this.ttsSay(text,rate):this.fail() } };
   try{ ss.speak(u) }catch(e){ return this.tts?this.ttsSay(text,rate):this.fail() }
   clearTimeout(this.chk);
   this.chk=setTimeout(()=>{ if(this.cur===u && !started && !ss.speaking){ try{ss.cancel()}catch(e){} this.tts?this.ttsSay(text,rate):this.fail() } },2500);
   return;
  }
  if(this.tts) return this.ttsSay(text,rate);
  this.fail();
 },
 fail(){ if(this.helped) return toast("No sound came out. Open Settings › Sound help."); this.helped=true; openSoundHelp() },
 stop(){clearTimeout(this.chk);this.cur=null;try{speechSynthesis.cancel()}catch(e){} try{this.tts?.stop()}catch(e){}}
};

const IS_IOS=/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
const IS_STANDALONE=navigator.standalone===true||(window.matchMedia&&matchMedia("(display-mode: standalone)").matches);
/* Record-and-compare: works where speech checking doesn't (like iPhone home-screen apps). */
const Rec = {
 s:null,
 ok(){ return !!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia&&window.MediaRecorder) },
 start(h){
  Voice.stop(); const s={}; this.s=s;
  s.boot=setTimeout(()=>{ if(this.s===s&&!s.mr){ this.s=null; h.error("no-start") } },8000);
  navigator.mediaDevices.getUserMedia({audio:true}).then(st=>{
   if(this.s!==s){ st.getTracks().forEach(t=>t.stop()); return }
   clearTimeout(s.boot); const chunks=[]; let mr;
   try{ mr=new MediaRecorder(st) }catch(e){ st.getTracks().forEach(t=>t.stop()); this.s=null; return h.error("audio-capture") }
   s.mr=mr; s.st=st;
   mr.ondataavailable=e=>{ if(e.data&&e.data.size) chunks.push(e.data) };
   mr.onstop=()=>{ st.getTracks().forEach(t=>t.stop()); if(!chunks.length) return h.error("no-speech");
     h.done(URL.createObjectURL(new Blob(chunks,{type:mr.mimeType||"audio/mp4"}))) };
   mr.start(); h.started(); s.max=setTimeout(()=>this.stop(),8000);
  }).catch(e=>{ clearTimeout(s.boot); if(this.s===s){ this.s=null; h.error(e&&e.name==="NotAllowedError"?"not-allowed":"audio-capture") } });
 },
 recording(){ return !!this.s },
 stop(){ const s=this.s; if(!s)return; this.s=null; clearTimeout(s.max); clearTimeout(s.boot);
  if(s.mr&&s.mr.state!=="inactive"){ try{s.mr.stop()}catch(e){} } else if(s.st){ s.st.getTracks().forEach(t=>t.stop()) } }
};
const Mic = {
 dict:null, Native: window.SpeechRecognition||window.webkitSpeechRecognition, framed: window.parent!==window, s:null,

   if(!d) return; this.dict=d;
   d.onPartial(({text})=>{ if(this.s?.mode==="dict"){ this.s.part=text; this.s.h.partial((this.s.text+" "+text).trim()) } });
   d.onFinal(({text})=>{ const s=this.s; if(s?.mode!=="dict")return; s.text+=text; s.part=""; s.h.partial(s.text.trim());
     clearTimeout(s.quiet); s.quiet=setTimeout(()=>this.finish(),1500) });
   d.onState(({state,reason})=>{ const s=this.s; if(!s||s.mode!=="dict"||state!=="idle")return;
     this.s=null; clearTimeout(s.quiet); clearTimeout(s.max);
     if(s.text.trim()) s.h.result([s.text.trim()]); else s.h.error(reason==="stopped"||reason==="viewer_stopped"?"no-speech":reason) });
   refreshMicNotes();
  }).catch(()=>{});
 },
 available(){ return !!(this.dict||this.Native) },
 listening(){ return !!this.s },
 start(h){ // must run synchronously inside a tap
  Voice.stop();

 startDict(h){

  this.dict.start({language:S.lang==="es-419"?"es-MX":S.lang}).then(()=>h.started()).catch(e=>{
   if(this.s===s){this.s=null;h.error(e?.code||"failed")} });

  // (WebKit bug 321436). Workaround: say a short cue with the phone's voice, start listening right
  // when it ends, listen for one phrase. After each word the mic is released, and if an old session
  // is still holding the mic, it is shut down and a brand-new recognizer is used.
  const ios=IS_IOS;

  const text=()=>{ const all=s.list.map(r=>r[0]).join(" ").trim(); const last=(s.list[s.list.length-1]||[""])[0].trim();
    return [...new Set([all,last].filter(Boolean))] };

    if(!ios){ try{rec.abort()}catch(e){} return }

      setTimeout(()=>{ if(!s.ended) drop() },1500) },1000) };

    if(text().length) return h.result(alts);

    s.over=true; clear(); try{rec.abort()}catch(e){} if(this.rec===rec){ this.rec=null; this.recBusy=false }

    try{ rec.start() }catch(e){ this.recBusy=false;
      if(!h.fresh) return fresh();

    if(!ios || !Voice.hasSS()) return go();

  s.boot=setTimeout(()=>{ if(!s.started&&!s.over){ if(!h.fresh) return fresh(); s.err="no-start"; s.done(); drop() } }, ios?7000:7000);

    const t=(s.text+" "+(s.part||"")).trim(); this.dict.stop().catch(()=>{});
    return t? s.h.result([t]) : s.h.error("stopped-early") }
  if(s.finishing) return; s.finishing=true; s.stoppedByTap=true; s.h.checking&&s.h.checking();
  if(!s.started) return s.done();
  if(IS_IOS && s.list.length) return s.done();

/* ---------- Scoring ---------- */
const U=["cero","uno","dos","tres","cuatro","cinco","seis","siete","ocho","nueve","diez","once","doce","trece","catorce","quince","dieciseis","diecisiete","dieciocho","diecinueve","veinte","veintiuno","veintidos","veintitres","veinticuatro","veinticinco","veintiseis","veintisiete","veintiocho","veintinueve"];
const T={3:"treinta",4:"cuarenta",5:"cincuenta",6:"sesenta",7:"setenta",8:"ochenta",9:"noventa"};
const H={1:"ciento",2:"doscientos",3:"trescientos",4:"cuatrocientos",5:"quinientos",6:"seiscientos",7:"setecientos",8:"ochocientos",9:"novecientos"};
function numEs(n){ if(n<30)return U[n]; if(n<100){const r=n%10;return T[Math.floor(n/10)]+(r?" y "+U[r]:"")}
 if(n<1000){const c=Math.floor(n/100),r=n%100; if(n===100)return "cien"; return H[c]+(r?" "+numEs(r):"")} return String(n)}
function norm(s){
 s=s.toLowerCase().replace(/['’]s\b/g,"s")
  .replace(/\$\s?(\d+)(?:[.,](\d{2}))?/g,(m,a,b)=>a+" dolares"+(b&&b!=="00"?" con "+(+b)+" centavos":""))
  .replace(/(\d)[\s-](?=\d)/g,"$1|")
  .replace(/\d+(\|\d+)+/g,m=>m.split("|").map(x=>x.split("").map(d=>U[+d]).join(" ")).join(" "))
  .replace(/\d+/g,m=>+m<1000?numEs(+m):m)
  .replace(/[áàä]/g,"a").replace(/[éèë]/g,"e").replace(/[íìï]/g,"i").replace(/[óòö]/g,"o").replace(/[úùü]/g,"u")
  .replace(/[^a-zñ0-9\s]/g," ");
 return s.split(/\s+/).filter(Boolean).map(w=>({un:"uno",una:"uno",hongos:"champinones"}[w]||w));
}
function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=[...Array(n+1).keys()];
 for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
function sim(a,b){ if(a===b)return 1; const d=lev(a,b); return 1-d/Math.max(a.length,b.length) }
function grade(target, heard){
 const t=norm(target), h=norm(heard), m=t.length, n=h.length;
 const dp=Array.from({length:m+1},()=>Array(n+1).fill(0));
 const val=(i,j)=>{const x=sim(t[i],h[j]);return x===1?1:x>=0.7?0.6:0};
 for(let i=m-1;i>=0;i--)for(let j=n-1;j>=0;j--){const v=val(i,j);dp[i][j]=Math.max(dp[i+1][j],dp[i][j+1],v?v+dp[i+1][j+1]:0)}
 const st=Array(m).fill("miss"); let i=0,j=0;
 while(i<m&&j<n){const v=val(i,j); if(v&&dp[i][j]===v+dp[i+1][j+1]){st[i]=v===1?"ok":"close";i++;j++} else if(dp[i+1][j]>=dp[i][j+1])i++; else j++}
 const extra=Math.max(0,n-m-1)*0.05;
 const score=m?Math.max(0,Math.round(100*(dp[0][0]/m-extra))):0;
 return {score,status:st,heard};
}
function bestGrade(target, alts){ return alts.map(a=>grade(target,a)).sort((a,b)=>b.score-a.score)[0] }
function tipsFor(word){
 const w=word.toLowerCase(), out=[];
 if(/rr/.test(w)||/^r/.test(w)) out.push(`Roll the r in “${word}”: let the tip of your tongue flutter behind your top teeth.`);
 else if(/r/.test(w)) out.push(`The r in “${word}” is a quick tap, like the tt in “butter”.`);
 if(/j|g[eéií]/.test(w)) out.push(`In “${word}”, j (and g before e or i) is a breathy h, like jamón = ha-MOHN.`);
 if(/ll/.test(w)) out.push(`In “${word}”, ll sounds like an English y: cebolla = seh-BOH-yah.`);
 if(/ñ/.test(w)) out.push(`In “${word}”, ñ sounds like the ny in “canyon”.`);
 if(/(^|[^c])h/.test(w)) out.push(`The h in “${word}” is silent.`);
 if(/qu/.test(w)) out.push(`In “${word}”, qu is a plain k sound: queso = KEH-soh.`);
 if(/z|c[eéií]/.test(w) && S.lang!=="es-ES") out.push(`In Mexican Spanish, z and c before e or i sound like s in “${word}”.`);
 if(/v/.test(w)) out.push(`The v in “${word}” sounds close to a soft b.`);
 if(/[áéíóú]/.test(w)) out.push(`Put the stress on the syllable with the accent mark in “${word}”.`);
 if(!out.length) out.push(`Keep the vowels in “${word}” short and pure: a = ah, e = eh, i = ee, o = oh, u = oo.`);
 return out;
}
function feedbackHTML(target, g){
 const words=target.split(/\s+/); const nt=norm(target);
 // map display words to normalized statuses (display words may expand, e.g. numbers)
 let k=0; const disp=words.map(w=>{const parts=norm(w);const sts=g.status.slice(k,k+parts.length);k+=parts.length;
   const s=!parts.length?"ok":sts.every(x=>x==="ok")?"ok":sts.some(x=>x==="miss")?"miss":"close";return [w,s]});
 const verdict=g.score>=85?"Excelente":g.score>=60?"Casi. Almost there":"Keep practicing";
 const color=g.score>=85?"var(--ok)":g.score>=60?"var(--close)":"var(--miss)";
 const trouble=disp.filter(([,s])=>s!=="ok").map(([w])=>w.replace(/[¿?¡!.,]/g,""));
 const tips=[...new Set(trouble.flatMap(tipsFor))].slice(0,3);
 return `<div class="fb">
  <div class="verdict"><b style="color:${color}">${verdict}</b><span>${g.score}%</span></div>
  <div class="meter"><i style="width:${g.score}%;background:${color}"></i></div>
  <div class="words">${disp.map(([w,s])=>`<span class="w-${s}">${esc(w)}</span>`).join(" ")}</div>
  <div class="heard">I heard: “${esc(g.heard)}”</div>
  ${tips.length?`<ul class="tips">${tips.map(t=>`<li>${esc(t)}</li>`).join("")}</ul>`:`<div class="muted">Every word came through clearly.</div>`}
 </div>`;
}

/* Mic widget: big button + live transcript + feedback. Falls back to record-and-compare. */
function micWidget(target, onDone){
 const box=document.createElement("div"); box.className="mic-area";
 const canCheck=Mic.available();
 if(!canCheck && !Rec.ok()){
  box.innerHTML=`<div class="note">${MIC_ERR.unsupported} You can still tap the speaker, listen, and repeat out loud.</div>`; return box;
 }
 box.innerHTML=`<button class="bigmic" type="button"></button><div class="live"></div><div class="out"></div>
  ${canCheck&&Rec.ok()?`<button class="linkbtn" type="button" data-recmode>Record myself instead</button>`:""}`;
 const btn=$(".bigmic",box), live=$(".live",box), out=$(".out",box);
 let mode=canCheck?"check":"rec";
 const idle=()=>{btn.classList.remove("on");btn.innerHTML=mode==="check"?`${ICON.mic}<span>Tap and say it</span>`:`${ICON.mic}<span>Record myself</span>`};
 const on=()=>{btn.classList.add("on");btn.innerHTML=`${ICON.stop}<span>${mode==="check"?"Listening…":"Recording…"} tap when done</span>`};
 idle();
 if(mode==="rec") out.innerHTML=`<div class="note">Record yourself, then compare with the Spanish voice.</div>`;
 const showRec=url=>{
  out.innerHTML=`<div class="fb"><div class="verdict"><b>Compare</b></div>
   <div class="row"><button class="btn ghost" data-mine>${ICON.spk}Play mine</button><button class="btn ghost" data-model>${ICON.spk}Play Spanish</button></div>
   <div class="row"><button class="btn" data-good>Sounded right</button><button class="btn ghost" data-again>Not yet</button></div></div>`;
  const au=new Audio(url);
  $("[data-mine]",out).onclick=()=>{Voice.stop();au.currentTime=0;au.play().catch(()=>toast("Couldn't play your recording."))};
  $("[data-model]",out).onclick=()=>{au.pause();Voice.say(target)};
  $("[data-good]",out).onclick=()=>{out.innerHTML=`<div class="note">Nice. Keep going.</div>`;onDone&&onDone({score:100,self:true})};
  $("[data-again]",out).onclick=()=>{out.innerHTML="";onDone&&onDone({score:0,self:true})};
 };
 const showErr=code=>{ idle(); live.textContent="";
  out.innerHTML=`<div class="note">${esc(MIC_ERR[code]||"Something went wrong with the microphone. Try again.")} <span class="muted">(${esc(code)})</span></div>`;
};
 const rm=$("[data-recmode]",box);
 if(rm) rm.onclick=()=>{ Mic.cancel(); mode="rec"; rm.remove(); idle(); out.innerHTML=`<div class="note">Record yourself, then compare with the Spanish voice.</div>` };
 btn.addEventListener("click",()=>{
  if(mode==="check"){
   if(Mic.listening()){Mic.finish();return}
   out.innerHTML=""; live.textContent="Getting the mic ready…"; on();
   Mic.start({
    started(){live.textContent=IS_IOS?"Listening… say it now":"Listening… say it, then tap the button"},
    cue(){live.textContent="Get ready…"},
    checking(){btn.classList.remove("on");btn.innerHTML=`<span>Checking what you said…</span>`},
    partial(t){live.textContent=t},
    result(alts){idle(); live.textContent=""; const g=bestGrade(target,alts); out.innerHTML=feedbackHTML(target,g); onDone&&onDone(g)},
    error:showErr
   });
  } else {
   if(Rec.recording()){Rec.stop();return}
   out.innerHTML=""; live.textContent="Getting the mic ready…"; on();
   Rec.start({ started(){live.textContent="Recording… say it now"}, done(url){idle();live.textContent="";showRec(url)}, error:showErr });
  }
 });
 return box;
}

const quiz={running:false,qs:[],i:0,score:0,answered:false,missed:[],topic:"All",speak:true};
function buildQuiz(){
 let pool = quiz.topic==="Phrases"?PHRASES : quiz.topic==="All"?[...VOCAB,...PHRASES] : VOCAB.filter(v=>v.cat===quiz.topic);
 if(pool.length<4) pool=[...VOCAB];
 const types=["es2en","en2es","listen"]; if(quiz.speak&&Mic.available()) types.push("say");
 return shuffle(pool).slice(0,10).map((it,k)=>{
  const type=types[k%types.length];
  const same=pool.filter(x=>x.id!==it.id && x.en!==it.en && x.cat===it.cat); const others=shuffle(same.length>=3?same:pool.filter(x=>x.id!==it.id && x.en!==it.en)).slice(0,3);
  return {it,type,opts:shuffle([it,...others])};
 }).sort(()=>Math.random()-.5);
}

  } else {

 const inFrame=window.parent!==window;
 bg.innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-label="Settings"><div class="grab"></div>
  <div class="sheet-head"><h2 style="margin:0">Settings</h2><button class="iconbtn" data-x aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
  <div class="setup mt">
   <label class="field" for="lang">Accent<select id="lang">${Object.entries(ACCENTS).map(([k,v])=>`<option value="${k}" ${k===S.lang?"selected":""}>${v} (${k})</option>`).join("")}</select></label>
   <label class="field" for="rate">Speaking speed: <span id="rateV">${S.rate.toFixed(2)}×</span><input type="range" id="rate" min="0.6" max="1.2" step="0.05" value="${S.rate}"></label>
   <div class="row"><button class="btn ghost" data-test>${ICON.spk}Test the voice</button><button class="btn ghost" data-help>Sound help</button></div>
   <div class="muted" id="voiceInfo"></div>
   <div class="note"><b>Add to your home screen</b><br>
    iPhone: open this page in Safari, tap Share, then <b>Add to Home Screen</b>.<br>
    Android: open it in Chrome, tap the ⋮ menu, then <b>Add to Home screen</b> or <b>Install app</b>.</div>
   <button class="btn ghost" data-reset>Reset my progress</button>
  </div></div>`;
 const vi=$("#voiceInfo",bg); const v=Voice.pick();
 vi.textContent = v?`Voice: ${v.name} (${v.lang})`: Voice.tts?"Voice: Claude voice":"No Spanish voice found on this device. On iPhone, add one in Settings › Accessibility › Spoken Content › Voices › Spanish.";
 const close=()=>{bg.remove();render()};
 bg.addEventListener("click",e=>{if(e.target===bg)close()}); $("[data-x]",bg).onclick=close;
 $("#lang",bg).onchange=e=>{S.lang=e.target.value;save("lang",S.lang);setAccent();const v=Voice.pick();vi.textContent=v?`Voice: ${v.name} (${v.lang})`:vi.textContent};
 $("#rate",bg).oninput=e=>{S.rate=+e.target.value;save("rate",S.rate);$("#rateV",bg).textContent=S.rate.toFixed(2)+"×"};
 $("[data-help]",bg).onclick=()=>{bg.remove();openSoundHelp()};
 $("[data-test]",bg).onclick=()=>Voice.say("Hola, bienvenido. ¿Qué le puedo servir?");
 let armed=false; $("[data-reset]",bg).onclick=e=>{ if(!armed){armed=true;e.target.textContent="Tap again to erase progress";return}
  S.known=new Set();S.best=null;save("known",[]);save("best",null);e.target.textContent="Progress erased";toast("Progress erased") };
 document.body.appendChild(bg);
}
function setAccent(){ $("#accentBtn").textContent=S.lang; $("#sub").textContent=`Spanish for the Domino's counter · ${ACCENTS[S.lang]} accent` }

/* ---------- Router ---------- */
function render(){
 const tab=(location.hash||"#words").slice(1); const v=$("#view");
 document.querySelectorAll("nav.tabs a").forEach(a=>a.setAttribute("aria-current",a.dataset.tab===tab?"page":"false"));
 if(tab==="phrases") v.innerHTML=listView(PHRASES,"phraseCat","Counter phrases","What you'll say most at the register. Tap any line to hear it.");
 else if(tab==="talk"){ v.innerHTML=talkView(); afterTalk() }
 else if(tab==="quiz"){ v.innerHTML=quizView(); afterQuiz() }
 else v.innerHTML=listView(VOCAB,"wordCat","Toppings & menu words","Built around the Domino's menu. Tap a word to hear it, or tap the mic to say it and get feedback.");
}
document.addEventListener("click",e=>{
 const t=e.target.closest("button,[data-reveal]"); if(!t)return; const d=t.dataset;
 if(d.cat!=null){ const key=(location.hash==="#phrases")?"phraseCat":"wordCat"; ui[key]=d.cat; render(); return }
 if(d.say!=null && t.closest("#view")){ const it=byId(d.say); it&&Voice.say(it.es); return }
 if(d.prac!=null){ const it=byId(d.prac); it&&openPractice(it); return }
 if(d.scene!=null) return startScene(+d.scene);
 if(d.back!=null){ talk.scene=null; Voice.stop(); Mic.cancel(); render(); return }
 if(d.next!=null){ Mic.cancel(); Rec.stop(); return talkAdvance() }
 if(d.restart!=null) return startScene(talk.scene);
 if(d.nextscene!=null) return startScene((talk.scene+1)%SCENES.length);
 if(d.replay!=null){ Voice.say(SCENES[talk.scene].lines[+d.replay][1]); return }
 if(d.sayline!=null){ Voice.say(SCENES[talk.scene].lines[talk.idx][1]); return }
 if(d.slowline!=null){ Voice.say(SCENES[talk.scene].lines[talk.idx][1],true); return }
 if(d.reveal!=null){ t.classList.remove("hidden-es"); return }
 if(d.qstart!=null){ quiz.qs=buildQuiz(); quiz.i=0; quiz.score=0; quiz.missed=[]; quiz.answered=false; quiz.running=true; render(); return }
 if(d.ans!=null) return answer(d.ans,t);
 if(d.qplay!=null){ Voice.say(quiz.qs[quiz.i].it.es); return }
 if(d.qskip!=null){ Mic.cancel(); if(!quiz.answered){quiz.answered=true; quiz.missed.push(quiz.qs[quiz.i].it)} $("#qreveal").innerHTML=`<div class="muted">Answer: <b>${esc(quiz.qs[quiz.i].it.es)}</b></div>`; Voice.say(quiz.qs[quiz.i].it.es); showNext(); return }
 if(d.qnext!=null) return nextQ();
});
document.addEventListener("change",e=>{
 if(e.target.id==="hideEs"){S.hideEs=e.target.checked;save("hideEs",S.hideEs);render()}
 if(e.target.id==="qtopic") quiz.topic=e.target.value;
 if(e.target.id==="qspeak") quiz.speak=e.target.checked;
});
$("#setBtn").onclick=openSettings; $("#accentBtn").onclick=openSettings;
window.addEventListener("hashchange",()=>{Mic.cancel();Rec.stop();render();window.scrollTo(0,0)});
Voice.init(); Mic.init(); setAccent(); render();
if("serviceWorker" in navigator && !window.claude && location.protocol==="https:"){ navigator.serviceWorker.register("sw.js").catch(()=>{}) }
</script>

</body></html>
